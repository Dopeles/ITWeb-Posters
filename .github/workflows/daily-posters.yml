name: Daily ITWeb posters

on:
  schedule:
    - cron: '5 11 * * 1-5'   # 13:05 SAST, weekdays
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run posters
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit posters
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add posters
          git diff --cached --quiet || git commit -m "Posters for $(TZ=Africa/Johannesburg date +%F)"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: posters
          path: posters/
          retention-days: 14
